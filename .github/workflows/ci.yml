name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Ready for the server integration tests (GDD §26); unit tests use PGlite.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pixel
          POSTGRES_PASSWORD: pixel
          POSTGRES_DB: pixel_packs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pixel:pixel@localhost:5432/pixel_packs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Migrate against Postgres
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm build
